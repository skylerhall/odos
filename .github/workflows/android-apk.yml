# Builds an installable ODOS APK on every push to main (or on demand from the Actions tab)
# and publishes it at: Releases → "ODOS for Android (latest build)".
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Repo secret (Settings → Secrets and variables → Actions). Without it the app installs but
      # shows a "add your Mapbox token" screen instead of the map.
      EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
      EXPO_PUBLIC_RIDB_KEY: ${{ secrets.RIDB_KEY }}
      ODOS_VERSION_CODE: ${{ github.run_number }}
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Warn if the Mapbox token secret is missing
        if: env.EXPO_PUBLIC_MAPBOX_TOKEN == ''
        run: echo "::warning::MAPBOX_TOKEN secret is not set. The APK will build, but the map stays blank until you add it and re-run."

      - run: npm ci

      - name: Tests, types, lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Release signing (plugins/withReleaseSigning.js). With the ANDROID_KEYSTORE_BASE64 and
      # ANDROID_KEYSTORE_PASSWORD secrets set, the APK is signed with ODOS's own key: Google Play needs
      # it, and only APKs signed with it install over each other. Without them it falls back to the
      # template's shared debug key. The secrets are only passed to the steps that need them.
      - name: Load the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret is not set. This APK is signed with the shared debug key."
            exit 0
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is not."
            exit 1
          fi
          KEYSTORE="$RUNNER_TEMP/odos-release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storepass "$KEYSTORE_PASSWORD" -alias odos >/dev/null; then
            echo "::error::Couldn't open the signing key: check that both secrets were pasted in full."
            exit 1
          fi
          echo "ODOS_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"

      # Only 64-bit ARM (every Android phone from roughly 2017 on). Packaging all four CPU types
      # made the APK ~150 MB; this keeps it to about a third of that.
      - name: Build release APK
        working-directory: android
        env:
          ODOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ODOS_KEY_ALIAS: odos
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/odos-release.keystore"

      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk odos.apk

      - name: Check which key signed the APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          CERTS=$("$APKSIGNER" verify --print-certs odos.apk)
          echo "$CERTS" | grep -E 'certificate (DN|SHA-256 digest)'
          if [ -n "$ODOS_KEYSTORE_FILE" ] && ! echo "$CERTS" | grep -q 'CN=ODOS'; then
            echo "::error::The release key was loaded but the APK isn't signed with it."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: odos-apk
          path: odos.apk

      # Update the one "apk-latest" release in place (replace the file, move the tag) rather than
      # delete-and-recreate, and retry each call: a single GitHub API 500 used to fail the build.
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "Attempt $i failed: $*"; sleep $((i * 10)); done; return 1; }
          NOTES="Build #${{ github.run_number }} from ${GITHUB_SHA::7}. On your phone: tap odos.apk below, then Install."
          if retry gh release view apk-latest >/dev/null; then
            git tag -f apk-latest "$GITHUB_SHA"
            retry git push -f origin refs/tags/apk-latest
            retry gh release upload apk-latest odos.apk --clobber
            retry gh release edit apk-latest --notes "$NOTES" --latest
          else
            retry gh release create apk-latest odos.apk --title "ODOS for Android (latest build)" \
              --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
